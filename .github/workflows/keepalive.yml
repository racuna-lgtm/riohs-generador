name: Supabase Keepalive RIOHS

# Mantiene "despierto" el proyecto Supabase del Portal RIOHS haciendo una
# consulta real a la tabla heartbeat. Los pings de URL no cuentan; esto sí,
# porque PostgREST ejecuta un SELECT real contra la base de datos.

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días a las 12:17 UTC (~08:17 en Chile)
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar tabla heartbeat (mantiene el proyecto activo)
        run: |
          echo "Consultando heartbeat en Supabase RIOHS..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://cayvrsqyjljqnrtsagwq.supabase.co/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: sb_publishable_JLaCYGFE3fq6b7ecDl0glA_axBuVRZo" \
            -H "Authorization: Bearer sb_publishable_JLaCYGFE3fq6b7ecDl0glA_axBuVRZo")
          echo "Respuesta HTTP: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "OK: proyecto activo."
          else
            echo "Aviso: respuesta inesperada ($CODE). Revisar el proyecto."
            exit 1
          fi
